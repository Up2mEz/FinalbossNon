<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290"><defs><marker id="a-week09-triplet-margin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="aa-week09-triplet-margin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aha"/></marker><marker id="aw-week09-triplet-margin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahw"/></marker></defs><text x="360" y="24" text-anchor="middle" class="h">Triplet loss ตามสเกลของตัวอย่างสไลด์ 32 (α = 0.5)</text><rect x="60" y="44" width="53.94" height="40" rx="0" class="warn"/><text x="86.97" y="69" text-anchor="middle" class="wn">Hard</text><rect x="113.94" y="44" width="310" height="40" rx="0" class="acc"/><text x="268.94" y="69" text-anchor="middle" class="ac">Semi-hard: สมดุลที่สุด</text><rect x="423.94" y="44" width="256.06" height="40" rx="0" class="mut"/><text x="551.97" y="69" text-anchor="middle" class="s">Easy: loss = 0</text><line x1="40" y1="150" x2="700" y2="150" class="ln" marker-end="url(#a-week09-triplet-margin)"/><text x="696" y="142" text-anchor="end" class="s">d(a, x)</text><line x1="113.94" y1="112" x2="423.94" y2="112" class="lna"/><line x1="113.94" y1="106" x2="113.94" y2="118" class="lna"/><line x1="423.94" y1="106" x2="423.94" y2="118" class="lna"/><text x="268.94" y="105" text-anchor="middle" class="ac">margin α = 0.5</text><line x1="423.94" y1="150" x2="423.94" y2="166" class="ln"/><text x="423.94" y="180" text-anchor="middle" class="s">d(a,p)+α = 0.587</text><circle cx="60" cy="150" r="6" class="box"/><line x1="60" y1="156" x2="60" y2="244" class="ln dash"/><text x="66" y="248" text-anchor="start">a (anchor)</text><circle cx="81.7" cy="150" r="6" class="warn"/><line x1="81.7" y1="156" x2="81.7" y2="218" class="lnw"/><text x=