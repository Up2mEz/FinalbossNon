"160" text-anchor="middle" class="s">src_len &lt; tgt_len</text><text x="10" y="190" text-anchor="start" class="h">Text Infilling</text><text x="10" y="208" text-anchor="start" class="s">ทายความยาวช่วงที่หาย</text><rect x="190" y="172" width="240" height="36" rx="6" class="acc"/><text x="310" y="194.5" text-anchor="middle">The &lt;mask&gt; mat &lt;mask&gt; happily</text><rect x="470" y="172" width="240" height="36" rx="6" class="box"/><text x="590" y="194.5" text-anchor="middle">The cat sat on the mat happily</text><line x1="432" y1="190" x2="468" y2="190" class="ln" marker-end="url(#a-week08-bart-corruptions)"/><text x="310" y="226" text-anchor="middle" class="s">1 mask แทน 0 หรือหลายคำ</text><text x="10" y="256" text-anchor="start" class="h">Sentence Permutation</text><text x="10" y="274" text-anchor="start" class="s">โครงสร้างเอกสาร</text><rect x="190" y="238" width="240" height="36" rx="6" class="box"/><text x="310" y="260.5" text-anchor="middle">[S3] [S1] [S4] [S2]</text><rect x="470" y="238" width="240" height="36" rx="6" class="box"/><text x="590" y="260.5" text-anchor="middle">[S1] [S2] [S3] [S4]</text><line x1="432" y1="256" x2="468" y2="256" class="ln" marker-end="url(#a-week08-bart-corruptions)"/><text x="310" y="292" text-anchor="middle" class="s">สลับลำดับประโยค</text><text x="10" y="322" text-anchor="start" class="h">Document Rotation</text><text x="10" y="340" text-anchor="start" class="s">หาจุดเริ่มเอกสาร</text><rect x="190" y="304" width="240" height="36" rx="6" class="box"/><text x="310" y="326.5" text-anchor="middle">sat on the mat. The cat</text><rect x="470" y="304" width="240" height="36" rx="6" class="box"/><text x="590" y="326.5" text-anchor="middle">The cat sat on the mat.</text><line x1="432" y1="322" x2="468" y2="322" class="ln" marker-end="url(#a-week08-bart-corruptions)"/><text x="310" y="358" text-anchor="middle" class="s">หมุนเริ่มที่ token สุ่ม</text><text x="450" y="52" text-anchor="middle" class="s">กู้กลับ</text></svg>