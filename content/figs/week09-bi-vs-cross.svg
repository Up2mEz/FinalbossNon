<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><defs><marker id="a-week09-bi-vs-cross" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="aa-week09-bi-vs-cross" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aha"/></marker><marker id="aw-week09-bi-vs-cross" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahw"/></marker></defs><text x="180" y="24" text-anchor="middle" class="h">Bi-Encoder (SBERT)</text><text x="180" y="42" text-anchor="middle" class="s">รอบแรก: ดึงผู้สมัคร (recall)</text><text x="540" y="24" text-anchor="middle" class="h">Cross-Encoder</text><text x="540" y="42" text-anchor="middle" class="s">รอบสอง: จัดอันดับใหม่ (precision)</text><line x1="360" y1="14" x2="360" y2="428" class="ln dash"/><rect x="30" y="330" width="130" height="34" rx="6" class="box"/><text x="95" y="351.5" text-anchor="middle">Sentence A</text><rect x="30" y="250" width="130" height="40" rx="6" class="acc"/><text x="95" y="269" text-anchor="middle" class="ac">BERT</text><text x="95" y="284" text-anchor="middle" class="s">shared θ</text><rect x="30" y="190" width="130" height="32" rx="6" class="box"/><text x="95" y="210.5" text-anchor="middle">pooling</text><line x1="95" y1="330" x2="95" y2="290" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><text x="101" y="314" text-anchor="start" class="s">tokens</text><line x1="95" y1="250" x2="95" y2="222" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><text x="101" y="240" text-anchor="start" class="s">H</text><line x1="95" y1="190" x2="95" y2="165" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><rect x="200" y="330" width="130" height="34" rx="6" class="box"/><text x="265" y="351.5" text-anchor="middle">Sentence B</text><rect x="200" y="250" width="130" height="40" rx="6" class="acc"/><text x="265" y="269" text-anchor="middle" class="ac">BERT</text><text x="265" y="284" text-anchor="middle" class="s">shared θ</text><rect x="200" y="190" width="130" height="32" rx="6" class="box"/><text x="265" y="210.5" text-anchor="middle">pooling</text><line x1="265" y1="330" x2="265" y2="290" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><text x="271" y="314" text-anchor="start" class="s">tokens</text><line x1="265" y1="250" x2="265" y2="222" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><text x="271" y="240" text-anchor="start" class="s">H</text><line x1="265" y1="190" x2="265" y2="165" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><rect x="65" y="135" width="60" height="30" rx="6" class="box"/><text x="95" y="154.5" text-anchor="middle">u</text><rect x="235" y="135" width="60" height="30" rx="6" class="box"/><text x="265" y="154.5" text-anchor="middle">v</text><line x1="160" y1="270" x2="200" y2="270" class="ln dash"/><text x="180" y="264" text-anchor="middle" class="s">tied</text><rect x="125" y="70" width="110" height="30" rx="6" class="acc"/><text x="180" y="89.5" text-anchor="middle" class="ac">cos(u, v)</text><line x1="95" y1="135" x2="150" y2="100" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><line x1="265" y1="135" x2="210" y2="100" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><text x="180" y="392" text-anchor="middle" class="ac">O(n) forward + dot product</text><text x="180" y="410" text-anchor="middle" class="s">n = 10,000 → ≈ 50 วินาที</text><text x="180" y="426" text-anchor="middle" class="s">cache เวกเตอร์ล่วงหน้าได้</text><rect x="420" y="330" width="240" height="34" rx="6" class="box"/><text x="540" y="351.5" text-anchor="middle">[CLS] A [SEP] B [SEP]</text><rect x="420" y="250" width="240" height="40" rx="6" class="box"/><text x="540" y="269" text-anchor="middle">BERT</text><text x="540" y="284" text-anchor="middle" class="s">attention ข้ามประโยค A ↔ B</text><rect x="420" y="190" width="240" height="32" rx="6" class="box"/><text x="540" y="210.5" text-anchor="middle">[CLS] output</text><rect x="420" y="135" width="240" height="30" rx="6" class="box"/><text x="540" y="154.5" text-anchor="middle">head</text><rect x="450" y="70" width="180" height="30" rx="6" class="box"/><text x="540" y="89.5" text-anchor="middle">score (1 ค่า)</text><line x1="540" y1="330" x2="540" y2="290" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><text x="548" y="314" text-anchor="start" class="s">ทั้งคู่พร้อมกัน</text><line x1="540" y1="250" x2="540" y2="222" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><line x1="540" y1="190" x2="540" y2="165" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><line x1="540" y1="135" x2="540" y2="100" class="ln" marker-end="url(#a-week09-bi-vs-cross)"/><text x="540" y="392" text-anchor="middle" class="wn">O(n²) forward ต่อทุกคู่</text><text x="540" y="410" text-anchor="middle" class="s">n = 10,000 → ≈ 50 ล้านคู่ ≈ 69 ชม.</text><text x="540" y="426" text-anchor="middle" class="s">ต้องรันใหม่ทุกคู่ cache ไม่ได้</text></svg>