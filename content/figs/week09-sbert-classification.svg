<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530"><defs><marker id="a-week09-sbert-classification" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="aa-week09-sbert-classification" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aha"/></marker><marker id="aw-week09-sbert-classification" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahw"/></marker></defs><rect x="30" y="482" width="170" height="34" rx="6" class="box"/><text x="115" y="503.5" text-anchor="middle">A man is eating food</text><line x1="115" y1="482" x2="115" y2="452" class="ln" marker-end="url(#a-week09-sbert-classification)"/><text x="121" y="470" text-anchor="start" class="s">input_ids [1,7]</text><rect x="30" y="410" width="170" height="42" rx="6" class="acc"/><text x="115" y="430" text-anchor="middle" class="ac">BERT</text><text x="115" y="445" text-anchor="middle" class="s">tokenize แยกกัน</text><line x1="115" y1="410" x2="115" y2="376" class="ln" marker-end="url(#a-week09-sbert-classification)"/><text x="121" y="396" text-anchor="start" class="s">H_A [1,7,768]</text><rect x="30" y="336" width="170" height="40" rx="6" class="box"/><text x="115" y="355" text-anchor="middle">masked mean pooling</text><text x="115" y="370" text-anchor="middle" class="s">attention_mask ตัด [PAD]</text><line x1="115" y1="336" x2="115" y2="312" class="ln" marker-end="url(#a-week09-sbert-classification)"/><rect x="45" y="282" width="140" height="30" rx="6" class="box"/><text x="115" y="301.5" text-anchor="middle">u [1,768]</text><line x1="115" y1="282" x2="115" y2="252" class="ln" marker-end="url(#a-week09-sbert-classification)"/><rect x="290" y="482" width="170" height="34" rx="6" class="box"/><text x="375" y="503.5" text-anchor="middle">A man is eating pasta</text><line x1="375" y1="482" x2="375" y2="452" class="ln" marker-end="url(#a-week09-sbert-classification)"/><text x="381" y="470" text-anchor="start" class="s">input_ids [1,8]</text><rect x="290" y="410" width="170" height="42" rx="6" class="acc"/><text x="375" y="430" text-anchor="middle" class="ac">BERT</text><text x="375" y="445" text-anchor="middle" class="s">tokenize แยกกัน</text><line x1="375" y1="410" x2="375" y2="376" class="ln" marker-end="url(#a-week09-sbert-classification)"/><text x="381" y="396" text-anchor="start" class="s">H_B [1,8,768]</text><rect x="290" y="336" width="170" height="40" rx="6" class="box"/><text x="375" y="355" text-anchor="middle">masked mean pooling</text><text x="375" y="370" text-anchor="middle" class="s">attention_mask ตัด [PAD]</text><line x1="375" y1="336" x2="375" y2="312" class="ln" marker-end="url(#a-week09-sbert-classification)"/><rect x="305" y="282" width="140" height="30" rx="6" class="box"/><text x="375" y="301.5" text-anchor="middle">v [1,768]</text><line x1="375" y1="282" x2="375" y2="252" class="ln" marker-end="url(#a-week09-sbert-classification)"/><line x1="200" y1="431" x2="290" y2="431" class="ln dash"/><text x="245" y="425" text-anchor="middle" class="s">tied θ</text><rect x="80" y="210" width="330" height="42" rx="6" class="acc"/><text x="245" y="230" text-anchor="middle" class="ac">c = [u ; v ; |u − v|]</text><text x="245" y="245" text-anchor="middle" class="s">[B, 2304]</text><text x="420" y="236" text-anchor="start" class="s">768 + 768 + 768 = 2304</text><line x1="245" y1="210" x2="245" y2="180" class="ln" marker-end="url(#a-week09-sbert-classification)"/><rect x="135" y="148" width="220" height="32" rx="6" class="box"/><text x="245" y="168.5" text-anchor="middle">Linear  W ∈ ℝ^(2304×3)</text><line x1="245" y1="148" x2="245" y2="122" class="ln" marker-end="url(#a-week09-sbert-classification)"/><rect x="145" y="92" width="200" height="30" rx="6" class="box"/><text x="245" y="111.5" text-anchor="middle">logits [1,3]</text><text x="360" y="111" text-anchor="start" class="s">3 label: entailment / neutral / contradiction</text><line x1="245" y1="92" x2="245" y2="66" class="ln" marker-end="url(#a-week09-sbert-classification)"/><rect x="115" y="34" width="260" height="32" rx="6" class="warn"/><text x="245" y="54.5" text-anchor="middle" class="wn">CrossEntropy(logits, label)</text><text x="472" y="360" text-anchor="start" class="s">default ของ SBERT</text></svg>