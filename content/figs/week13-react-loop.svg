<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <defs>
    <marker id="a-week13-react-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
    <marker id="aa-week13-react-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aha"/></marker>
    <marker id="aw-week13-react-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahw"/></marker>
  </defs>
  <!-- query -->
  <rect x="10" y="62" width="70" height="56" rx="6" class="box"/>
  <text x="45" y="86" text-anchor="middle">Query</text>
  <text x="45" y="104" text-anchor="middle" class="s">q</text>
  <path d="M80 90 H140" class="ln" marker-end="url(#a-week13-react-loop)"/>
  <text x="110" y="82" text-anchor="middle" class="s">q</text>
  <!-- LLM -->
  <rect x="140" y="60" width="130" height="60" rx="6" class="acc"/>
  <text x="205" y="82" text-anchor="middle">LLM</text>
  <text x="205" y="98" text-anchor="middle" class="s">Thought τ_t</text>
  <text x="205" y="112" text-anchor="middle" class="s">Action a_t</text>
  <path d="M270 90 H360" class="lna" marker-end="url(#aa-week13-react-loop)"/>
  <text x="315" y="82" text-anchor="middle" class="ac">a_t</text>
  <!-- tool / environment -->
  <rect x="360" y="60" width="130" height="60" rx="6" class="box"/>
  <text x="425" y="84" text-anchor="middle">Tool / Env</text>
  <text x="425" y="102" text-anchor="middle" class="s">Search[...]</text>
  <!-- finish branch -->
  <path d="M205 60 V30 H630 V60" class="ln" marker-end="url(#a-week13-react-loop)"/>
  <text x="420" y="24" text-anchor="middle" class="s">action = finish</text>
  <rect x="566" y="60" width="140" height="60" rx="6" class="box"/>
  <text x="636" y="86" text-anchor="middle">Final Answer</text>
  <text x="636" y="104" text-anchor="middle" class="s">action.argument</text>
  <!-- observation appended to history -->
  <path d="M425 120 V204" class="ln" marker-end="url(#a-week13-react-loop)"/>
  <text x="433" y="166" class="s">o_t (observation จริง)</text>
  <rect x="140" y="204" width="350" height="50" rx="6" class="mut"/>
  <text x="315" y="226" text-anchor="middle">History h</text>
  <text x="315" y="244" text-anchor="middle" class="s">(τ₁,a₁,o₁) … (τ_t,a_t,o_t) — ต่อท้ายทุกรอบ</text>
  <!-- history back to LLM -->
  <path d="M205 204 V120" class="lna" marker-end="url(#aa-week13-react-loop)"/>
  <text x="197" y="166" text-anchor="end" class="s">prompt = (q, h)</text>
  <!-- max_steps guard -->
  <path d="M490 229 H566" class="lnw dash" marker-end="url(#aw-week13-react-loop)"/>
  <text x="528" y="221" text-anchor="middle" class="s">t = max</text>
  <rect x="566" y="204" width="140" height="50" rx="6" class="warn"/>
  <text x="636" y="226" text-anchor="middle">max_steps = 5</text>
  <text x="636" y="244" text-anchor="middle" class="s">"Max steps reached"</text>
  <text x="360" y="284" text-anchor="middle" class="s">state s_t = (q, h₁:t−1) รวมประวัติครบ จึงเป็น Markov บน augmented state</text>
</svg>
