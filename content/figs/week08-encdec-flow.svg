<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380"><defs><marker id="a-week08-encdec-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="aa-week08-encdec-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aha"/></marker><marker id="aw-week08-encdec-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahw"/></marker></defs><text x="145" y="22" text-anchor="middle" class="h">Encoder</text><text x="540" y="22" text-anchor="middle" class="h">Decoder</text><rect x="30" y="190" width="230" height="122" rx="6" class="ln dash"/><text x="10" y="255" text-anchor="start" class="s">×N</text><rect x="50" y="325" width="190" height="36" rx="6" class="box"/><text x="145" y="342" text-anchor="middle">src tokens</text><text x="145" y="357" text-anchor="middle" class="s">[batch, src_len]</text><rect x="50" y="262" width="190" height="40" rx="6" class="box"/><text x="145" y="281" text-anchor="middle">Self-Attention</text><text x="145" y="296" text-anchor="middle" class="s">bidirectional, no mask</text><rect x="50" y="200" width="190" height="40" rx="6" class="box"/><text x="145" y="224.5" text-anchor="middle">FFN</text><rect x="50" y="110" width="190" height="42" rx="6" class="acc"/><text x="145" y="130" text-anchor="middle" class="ac">h_enc</text><text x="145" y="145" text-anchor="middle" class="s">[batch, src_len, d_model]</text><line x1="145" y1="325" x2="145" y2="302" class="ln" marker-end="url(#a-week08-encdec-flow)"/><line x1="145" y1="262" x2="145" y2="240" class="ln" marker-end="url(#a-week08-encdec-flow)"/><line x1="145" y1="200" x2="145" y2="152" class="ln" marker-end="url(#a-week08-encdec-flow)"/><rect x="412" y="100" width="256" height="205" rx="6" class="ln dash"/><text x="672" y="205" text-anchor="start" class="s">×N</text><rect x="430" y="325" width="220" height="36" rx="6" class="box"/><text x="540" y="342" text-anchor="middle">tgt tokens (shifted right)</text><text x="540" y="357" text-anchor="middle" class="s">[batch, tgt_len]</text><rect x="430" y="255" width="220" height="40" rx="6" class="box"/><text x="540" y="274" text-anchor="middle">Masked Self-Attention</text><text x="540" y="289" text-anchor="middle" class="s">causal mask (มองซ้ายอย่างเดียว)</text><rect x="430" y="175" width="220" height="50" rx="6" class="acc"/><text x="540" y="199" text-anchor="middle" class="ac">Cross-Attention</text><text x="540" y="214" text-anchor="middle" class="s">Q ← decoder · K,V ← encoder</text><rect x="430" y="110" width="220" height="40" rx="6" class="box"/><text x="540" y="134.5" text-anchor="middle">FFN</text><rect x="430" y="42" width="220" height="46" rx="6" class="box"/><text x="540" y="64" text-anchor="middle">[batch, tgt_len, d_model]</text><text x="540" y="79" text-anchor="middle" class="s">→ [batch, tgt_len, vocab_size]</text><line x1="540" y1="325" x2="540" y2="295" class="ln" marker-end="url(#a-week08-encdec-flow)"/><line x1="540" y1="255" x2="540" y2="225" class="ln" marker-end="url(#a-week08-encdec-flow)"/><line x1="540" y1="175" x2="540" y2="150" class="ln" marker-end="url(#a-week08-encdec-flow)"/><line x1="540" y1="110" x2="540" y2="88" class="ln" marker-end="url(#a-week08-encdec-flow)"/><path d="M240 131 H335 V200 H430" class="lna" marker-end="url(#aa-week08-encdec-flow)"/><text x="343" y="160" text-anchor="start" class="ac">K, V</text><text x="343" y="176" text-anchor="start" class="s">cached</text></svg>