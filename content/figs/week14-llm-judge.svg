<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440">
  <defs>
    <marker id="a-week14-llm-judge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
    <marker id="aa-week14-llm-judge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aha"/></marker>
    <marker id="aw-week14-llm-judge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahw"/></marker>
  </defs>
  <text x="20" y="24" class="h">LLM-as-a-Judge: one judging call, then the swap trick</text>

  <!-- inputs -->
  <rect x="20" y="40" width="124" height="28" rx="5" class="box"/>
  <text x="82" y="59" class="t" text-anchor="middle">Question</text>
  <rect x="20" y="76" width="124" height="28" rx="5" class="box"/>
  <text x="82" y="95" class="t" text-anchor="middle">Answer A</text>
  <rect x="20" y="112" width="124" height="28" rx="5" class="box"/>
  <text x="82" y="131" class="t" text-anchor="middle">Answer B</text>
  <rect x="20" y="148" width="124" height="28" rx="5" class="mut dash"/>
  <text x="82" y="167" class="s" text-anchor="middle">Reference answer</text>

  <line x1="144" y1="108" x2="178" y2="108" class="ln" marker-end="url(#a-week14-llm-judge)"/>
  <text x="161" y="100" class="s" text-anchor="middle">fill</text>

  <rect x="180" y="40" width="160" height="136" rx="6" class="acc"/>
  <text x="260" y="64" class="h" text-anchor="middle">Judge prompt</text>
  <text x="260" y="90" class="s" text-anchor="middle">role: act as the judge</text>
  <text x="260" y="108" class="s" text-anchor="middle">criteria to weigh</text>
  <text x="260" y="126" class="s" text-anchor="middle">forced output format</text>
  <text x="260" y="144" class="s" text-anchor="middle">(so the verdict parses)</text>

  <line x1="340" y1="108" x2="380" y2="108" class="ln" marker-end="url(#a-week14-llm-judge)"/>
  <text x="360" y="100" class="s" text-anchor="middle">ask</text>
  <rect x="382" y="82" width="100" height="52" rx="6" class="box"/>
  <text x="432" y="113" class="t" text-anchor="middle">LLM judge</text>
  <line x1="482" y1="108" x2="530" y2="108" class="ln" marker-end="url(#a-week14-llm-judge)"/>
  <text x="506" y="100" class="s" text-anchor="middle">reply</text>
  <rect x="532" y="82" width="168" height="52" rx="6" class="box"/>
  <text x="616" y="104" class="t" text-anchor="middle">Verdict</text>
  <text x="616" y="122" class="s" text-anchor="middle">+ short reason</text>

  <!-- swap trick -->
  <text x="20" y="210" class="h">Swap trick against position bias</text>
  <rect x="20" y="224" width="190" height="30" rx="5" class="box"/>
  <text x="115" y="244" class="t" text-anchor="middle">Run 1: order A, B → w1</text>
  <rect x="20" y="264" width="190" height="30" rx="5" class="box"/>
  <text x="115" y="284" class="t" text-anchor="middle">Run 2: order B, A → w2</text>
  <line x1="210" y1="239" x2="248" y2="239" class="ln" marker-end="url(#a-week14-llm-judge)"/>
  <line x1="210" y1="279" x2="248" y2="279" class="ln" marker-end="url(#a-week14-llm-judge)"/>
  <rect x="250" y="224" width="170" height="70" rx="6" class="acc"/>
  <text x="335" y="254" class="t" text-anchor="middle">same winner</text>
  <text x="335" y="272" class="t" text-anchor="middle">in both orders?</text>
  <line x1="420" y1="239" x2="468" y2="239" class="lna" marker-end="url(#aa-week14-llm-judge)"/>
  <text x="444" y="231" class="s" text-anchor="middle">yes</text>
  <rect x="470" y="224" width="170" height="30" rx="5" class="box"/>
  <text x="555" y="244" class="t" text-anchor="middle">declare the winner</text>
  <line x1="420" y1="279" x2="468" y2="279" class="lnw" marker-end="url(#aw-week14-llm-judge)"/>
  <text x="444" y="271" class="s" text-anchor="middle">no</text>
  <rect x="470" y="264" width="170" height="30" rx="5" class="warn"/>
  <text x="555" y="284" class="wn" text-anchor="middle">label: inconsistent</text>
  <text x="20" y="318" class="s">If the two orders disagree the honest label is "inconsistent";</text>
  <text x="20" y="334" class="s">counting it as a tie is a scoring policy, not a measurement.</text>

  <!-- bias bars -->
  <text x="20" y="364" class="t">Length bias: fail rate on padded answers</text>
  <text x="20" y="388" class="t">Claude-v1</text>
  <rect x="100" y="376" width="173.5" height="14" class="warn"/>
  <text x="279" y="388" class="s">91.3%</text>
  <text x="20" y="410" class="t">GPT-3.5</text>
  <rect x="100" y="398" width="173.5" height="14" class="warn"/>
  <text x="279" y="410" class="s">91.3%</text>
  <text x="20" y="432" class="t">GPT-4</text>
  <rect x="100" y="420" width="16.5" height="14" class="warn"/>
  <text x="122" y="432" class="s">8.7%</text>

  <text x="380" y="364" class="t">Position bias: consistent in both orders</text>
  <text x="380" y="388" class="t">Claude-v1</text>
  <rect x="460" y="376" width="45.2" height="14" class="acc"/>
  <text x="511" y="388" class="s">23.8%</text>
  <text x="380" y="410" class="t">GPT-3.5</text>
  <rect x="460" y="398" width="87.8" height="14" class="acc"/>
  <text x="554" y="410" class="s">46.2%</text>
  <text x="380" y="432" class="t">GPT-4</text>
  <rect x="460" y="420" width="123.5" height="14" class="acc"/>
  <text x="590" y="432" class="s">65.0%</text>
</svg>
