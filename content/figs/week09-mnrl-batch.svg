<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364"><defs><marker id="a-week09-mnrl-batch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="aa-week09-mnrl-batch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aha"/></marker><marker id="aw-week09-mnrl-batch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahw"/></marker></defs><text x="360" y="24" text-anchor="middle" class="h">MNRL / InfoNCE: batch N คู่ → ตาราง N × N (ตัวอย่าง N = 4)</text><text x="138" y="64" text-anchor="middle" class="h">p1</text><text x="194" y="64" text-anchor="middle" class="h">p2</text><text x="250" y="64" text-anchor="middle" class="h">p3</text><text x="306" y="64" text-anchor="middle" class="h">p4</text><text x="100" y="105" text-anchor="end" class="h">q1</text><rect x="110" y="72" width="56" height="56" rx="2" class="acc"/><text x="138" y="104" text-anchor="middle" class="ac">q1·p1</text><rect x="166" y="72" width="56" height="56" rx="2" class="box"/><text x="194" y="104" text-anchor="middle" class="s">q1·p2</text><rect x="222" y="72" width="56" height="56" rx="2" class="box"/><text x="250" y="104" text-anchor="middle" class="s">q1·p3</text><rect x="278" y="72" width="56" height="56" rx="2" class="box"/><text x="306" y="104" text-anchor="middle" class="s">q1·p4</text><text x="100" y="161" text-anchor="end" class="h">q2</text><rect x="110" y="128" width="56" height="56" rx="2" class="box"/><text x="138" y="160" text-anchor="middle" class="s">q2·p1</text><rect x="166" y="128" width="56" height="56" rx="2" class="acc"/><text x="194" y="160" text-anchor="middle" class="ac">q2·p2</text><rect x="222" y="128" width="56" height="56" rx="2" class="box"/><text x="250" y="160" text-anchor="middle" class="s">q2·p3</text><rect x="278" y="128" width="56" height="56" rx="2" class="box"/><text x="306" y="160" text-anchor="middle" class="s">q2·p4</text><text x="100" y="217" text-anchor="end" class="h">q3</text><rect x="110" y="184" width="56" height="56" rx="2" class="box"/><text x="138" y="216" text-anchor="middle" class="s">q3·p1</text><rect x="166" y="184" width="56" height="56" rx="2" class="box"/><text x="194" y="216" text-anchor="middle" class="s">q3·p2</text><rect x="222" y="184" width="56" height="56" rx="2" class="acc"/><text x="250" y="216" text-anchor="middle" class="ac">q3·p3</text><rect x="278" y="184" width="56" height="56" rx="2" class="box"/><text x="306" y="216" text-anchor="middle" class="s">q3·p4</text><text x="100" y="273" text-anchor="end" class="h">q4</text><rect x="110" y="240" width="56" height="56" rx="2" class="box"/><text x="138" y="272" text-anchor="middle" class="s">q4·p1</text><rect x="166" y="240" width="56" height="56" rx="2" class="box"/><text x="194" y="272" text-anchor="middle" class="s">q4·p2</text><rect x="222" y="240" width="56" height="56" rx="2" class="box"/><text x="250" y="272" text-anchor="middle" class="s">q4·p3</text><rect x="278" y="240" width="56" height="56" rx="2" class="acc"/><text x="306" y="272" text-anchor="middle" class="ac">q4·p4</text><rect x="106" y="68" width="232" height="64" rx="4" class="lna dash"/><rect x="372" y="80" width="16" height="16" rx="2" class="acc"/><text x="398" y="93" text-anchor="start">แนวทแยง = positive (q_i, p_i)</text><rect x="372" y="118" width="16" height="16" rx="2" class="box"/><text x="398" y="131" text-anchor="start">นอกแนวทแยง = negative ฟรี (j ≠ i)</text><rect x="372" y="156" width="16" height="16" rx="2" class="lna dash"/><text x="398" y="169" text-anchor="start">แถวที่ i = softmax ของ sim(q_i, p_j)/τ</text><text x="372" y="210" text-anchor="start" class="ac">N = 256 → 255 negatives ต่อ query</text><text x="372" y="236" text-anchor="start">τ = 0.05–0.1</text><text x="372" y="256" text-anchor="start" class="s">ต่ำ: ขอบตัดสินแข็ง · สูง: เรียนนุ่ม</text><rect x="110" y="312" width="500" height="38" rx="6" class="box"/><text x="360" y="336" text-anchor="middle">L_i = −log [ exp(sim(q_i,p_i)/τ) / Σ_j exp(sim(q_i,p_j)/τ) ]</text></svg>