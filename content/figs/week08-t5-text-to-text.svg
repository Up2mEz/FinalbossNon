<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350"><defs><marker id="a-week08-t5-text-to-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="aa-week08-t5-text-to-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aha"/></marker><marker id="aw-week08-t5-text-to-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahw"/></marker></defs><text x="155" y="24" text-anchor="middle" class="h">Text in (prefix + input)</text><text x="400" y="24" text-anchor="middle" class="h">T5</text><text x="605" y="24" text-anchor="middle" class="h">Text out</text><rect x="10" y="44" width="290" height="54" rx="6" class="box"/><text x="22" y="66" text-anchor="start" class="ac">translate English to German:</text><text x="22" y="86" text-anchor="start">That is good.</text><rect x="500" y="44" width="210" height="54" rx="6" class="box"/><text x="605" y="75" text-anchor="middle">Das ist gut.</text><line x1="300" y1="71" x2="340" y2="71" class="ln" marker-end="url(#a-week08-t5-text-to-text)"/><line x1="460" y1="71" x2="498" y2="71" class="ln" marker-end="url(#a-week08-t5-text-to-text)"/><rect x="10" y="114" width="290" height="54" rx="6" class="box"/><text x="22" y="136" text-anchor="start" class="ac">summarize:</text><text x="22" y="156" text-anchor="start">[long article]</text><rect x="500" y="114" width="210" height="54" rx="6" class="box"/><text x="605" y="145" text-anchor="middle">[summary]</text><line x1="300" y1="141" x2="340" y2="141" class="ln" marker-end="url(#a-week08-t5-text-to-text)"/><line x1="460" y1="141" x2="498" y2="141" class="ln" marker-end="url(#a-week08-t5-text-to-text)"/><rect x="10" y="184" width="290" height="54" rx="6" class="box"/><text x="22" y="206" text-anchor="start" class="ac">sst2 sentence:</text><text x="22" y="226" text-anchor="start">this is great</text><rect x="500" y="184" width="210" height="54" rx="6" class="box"/><text x="605" y="215" text-anchor="middle">positive</text><line x1="300" y1="211" x2="340" y2="211" class="ln" marker-end="url(#a-week08-t5-text-to-text)"/><line x1="460" y1="211" x2="498" y2="211" class="ln" marker-end="url(#a-week08-t5-text-to-text)"/><rect x="10" y="254" width="290" height="54" rx="6" class="box"/><text x="22" y="276" text-anchor="start" class="ac">question: What color?</text><text x="22" y="296" text-anchor="start">context: The car is red.</text><rect x="500" y="254" width="210" height="54" rx="6" class="box"/><text x="605" y="285" text-anchor="middle">red</text><line x1="300" y1="281" x2="340" y2="281" class="ln" marker-end="url(#a-week08-t5-text-to-text)"/><line x1="460" y1="281" x2="498" y2="281" class="ln" marker-end="url(#a-week08-t5-text-to-text)"/><rect x="340" y="44" width="120" height="264" rx="6" class="acc"/><text x="400" y="112" text-anchor="middle" class="h">Encoder</text><text x="400" y="134" text-anchor="middle" class="h">+ Decoder</text><text x="400" y="178" text-anchor="middle" class="s">same weights</text><text x="400" y="200" text-anchor="middle" class="s">same loss</text><text x="400" y="222" text-anchor="middle" class="s">(cross-entropy)</text><text x="400" y="244" text-anchor="middle" class="s">same decoding</text><text x="360" y="334" text-anchor="middle" class="s">ไม่มี task head: งานใหม่ = prefix ใหม่ (สีฟ้า = prefix)</text></svg>