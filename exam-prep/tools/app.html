<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Exam Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/*__CSS__*/
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo"><span class="mark" id="mark">N</span><span id="logoText">Mock Exam</span></div>
    <select id="subjSel" class="subjsel hidden" aria-label="เลือกวิชา"></select>
    <div class="cand" id="cand"></div>
    <div class="grow"></div>
    <div id="timer" class="timer hidden" aria-label="เวลา">00:00:00</div>
    <button class="btn sm" id="themeBtn" type="button">โหมดสี</button>
    <button class="btn sm hidden" id="exitBtn" type="button">ออก</button>
  </div>
  <div class="segrow hidden" id="segrow"><div class="wrap"><div class="seg" id="seg"></div></div></div>
</header>

<main class="wrap">

<section id="start">
  <div class="hero">
    <div>
      <h1 id="hTitle"></h1>
      <p class="lead" id="hLead"></p>
      <div class="stats" id="hStats"></div>
      <div class="picker" id="picker" role="radiogroup" aria-label="ขอบเขต"></div>
    </div>
    <form class="card setup" id="setup" autocomplete="off">
      <h2>ตั้งค่าห้องสอบ</h2>
      <fieldset class="grp"><legend>ระดับความยาก</legend><div class="lvgrid" id="lvBox"></div></fieldset>
      <fieldset class="grp"><legend>ชุดข้อสอบ</legend><div class="opts2" id="setBox"></div></fieldset>
      <fieldset class="grp"><legend>โหมด</legend>
        <div class="toggle">
          <label><input type="radio" name="mode" value="exam" checked><span>สอบจริง<small>เงียบ จับเวลา</small></span></label>
          <label><input type="radio" name="mode" value="tutor"><span>ติวเตอร์<small>เฉลยทันที ขอใบ้ได้</small></span></label>
        </div>
      </fieldset>
      <fieldset class="grp"><legend>เวลา</legend>
        <div class="toggle" id="tlBox">
          <label><input type="radio" name="tl" value="auto" checked><span>ตามจริง<small id="tlAuto"></small></span></label>
          <label><input type="radio" name="tl" value="0"><span>ไม่จับเวลา<small>นับเวลาที่ใช้</small></span></label>
        </div>
      </fieldset>
      <div class="pv" id="pv" aria-live="polite"></div>
      <button class="btn primary" type="submit" style="width:100%;min-height:52px;font-size:1.05rem">เริ่มทำข้อสอบ</button>
      <button class="btn hidden" type="button" id="resumeBtn" style="width:100%;margin-top:10px">ทำต่อจากที่ค้างไว้</button>
    </form>
  </div>
  <div class="hist card pad"><div class="histhead"><h3>ประวัติการสอบ</h3><button class="btn sm" id="statsBtn" type="button">สถิติและคิวทบทวน</button></div><div id="hist" class="muted">ยังไม่มี</div></div>
</section>

<section id="exam" class="cock hidden">
  <details class="card map" id="map" open><summary><span>แผนที่ข้อสอบ</span><span class="cnt" id="mapcnt"></span></summary><div class="mapbody" id="mapbody"></div></details>
  <article class="card qcard" id="qcard"></article>
  <aside class="card tutor" id="tutor" aria-live="polite"></aside>
</section>

<section id="gate" class="page card pad hidden"></section>
<section id="results" class="page hidden"></section>
<section id="stats" class="page hidden"></section>
</main>

<script type="application/json" id="data">/*__DATA__*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" defer></script>
<script>
(function(){
'use strict';
var PACK=JSON.parse(document.getElementById('data').textContent);
var SUBJ=null,UL='',US='',UNITS=[],UCFG={},LV={},ALL={},BY={};
var S=null,tick=null,view='start';
var $=function(i){return document.getElementById(i)};
function K(k){return 'mock-'+SUBJ.id+'-'+k}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(t){return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function pad(n,l){return String(n).padStart(l,'0')}
function hs(w){return ' style="--h:'+(UCFG[w]?UCFG[w].hue:259)+'"'}
function lvName(l){return LV[l]?LV[l].name:'ระดับ '+l}
function lvChip(l){var m='<span class="meter" aria-hidden="true">';for(var i=1;i<=4;i++)m+='<i'+(i<=l?' class="on"':'')+'></i>';return '<span class="chip n lv">'+m+'</span>'+esc(lvName(l))+'</span>'}
function math(el){try{if(window.renderMathInElement)window.renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false})}catch(e){}}
window.addEventListener('load',function(){setTimeout(function(){math(document.body)},400)});
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function show(v){view=v;['start','exam','gate','results','stats'].forEach(function(x){$(x).classList.toggle('hidden',x!==v)});var inx=v==='exam'||v==='gate';$('timer').classList.toggle('hidden',!inx);$('segrow').classList.toggle('hidden',!inx);$('exitBtn').classList.toggle('hidden',v==='start');$('subjSel').classList.toggle('hidden',v!=='start'||PACK.subjects.length<2);if(v==='start')$('cand').textContent='';window.scrollTo(0,0)}
(function(){var t=store('mock-theme');if(t)document.documentElement.setAttribute('data-theme',t);$('themeBtn').addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme');var dark=c==='dark'||(!c&&matchMedia('(prefers-color-scheme:dark)').matches);var n=dark?'light':'dark';document.documentElement.setAttribute('data-theme',n);store('mock-theme',n)})})();

/* subject */
function setSubject(id){
  SUBJ=PACK.subjects.filter(function(s){return s.id===id})[0]||PACK.subjects[0];
  UL=SUBJ.units.label;US=SUBJ.units.short;UNITS=SUBJ.weeks.map(function(w){return w.id});
  UCFG={};SUBJ.weeks.forEach(function(w){UCFG[w.id]=w});LV={};SUBJ.levels.forEach(function(l){LV[l.id]=l});
  ALL={};BY={};SUBJ.questions.forEach(function(q){ALL[q.id]=q;var k=q.kind+'|'+q.week;(BY[k]=BY[k]||[]).push(q)});
  document.title=SUBJ.title;$('logoText').textContent=SUBJ.title;$('mark').textContent=SUBJ.mark||SUBJ.short.charAt(0);
}
function setName(id){if(id==='mix')return 'สุ่มผสมทุกชุด';var s=SUBJ.sets.filter(function(x){return x.id===id})[0];return s?s.name:id}
function lvLabel(v){return v==='mix'?'ผสมตามสัดส่วนข้อสอบจริง':lvName(+v)}

/* start */
function curVal(n,d){var e=document.querySelector('#setup input[name='+n+']:checked');return e?e.value:d}
function initStart(){
  var sel=$('subjSel');sel.innerHTML=PACK.subjects.map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===SUBJ.id?' selected':'')+'>'+esc(s.short+' '+s.title)+'</option>'}).join('');
  $('hTitle').textContent=SUBJ.heroTitle;$('hLead').textContent=SUBJ.lead;
  var tm=SUBJ.weeks.reduce(function(a,w){return a+w.mcq+w.fill},0);var tmc=SUBJ.weeks.reduce(function(a,w){return a+w.mcq},0);
  var d=SUBJ.exam&&SUBJ.exam.date?Math.ceil((new Date(SUBJ.exam.date)-new Date())/86400000):null;
  $('hStats').innerHTML=(d!==null?'<div class="stat"><b>'+Math.max(d,0)+'</b><span>วันก่อน'+esc(SUBJ.exam.label)+'</span></div>':'')+'<div class="stat"><b>'+tm+'</b><span>ข้อตามโครงจริง (ปรนัย '+tmc+' และเติมคำ '+(tm-tmc)+')</span></div>'+(SUBJ.exam&&SUBJ.exam.minutes?'<div class="stat"><b>'+SUBJ.exam.minutes+'</b><span>นาทีตามสัดส่วนจริง</span></div>':'')+'<div class="stat"><b>'+SUBJ.questions.length+'</b><span>ข้อในคลัง</span></div>';
  var cur=curVal('scope','all'),cs=curVal('set','mix'),cl=curVal('lv','mix');
  $('picker').innerHTML='<label class="wcard" style="--h:259;grid-column:1/-1"><input type="radio" name="scope" value="all" form="setup"'+(cur==='all'?' checked':'')+'><span class="num">ทั้งหมด</span><span class="nm">ข้อสอบเต็ม '+esc(SUBJ.units.range)+'</span><span class="ct">'+tmc+' ปรนัย + '+(tm-tmc)+' เติมคำ</span></label>'+
    SUBJ.weeks.map(function(w){return '<label class="wcard"'+hs(w.id)+'><input type="radio" name="scope" value="u'+w.id+'" form="setup"'+(cur==='u'+w.id?' checked':'')+'><span class="num">'+esc(US)+w.id+'</span><span class="nm">'+esc(w.name)+'</span><span class="ct">'+w.mcq+' + '+w.fill+' ข้อ</span></label>'}).join('');
  var cnt={};SUBJ.questions.forEach(function(q){if(q.kind==='mcq')cnt[q.level]=(cnt[q.level]||0)+1});
  $('lvBox').innerHTML='<label class="lv mixlv"><input type="radio" name="lv" value="mix"'+(cl==='mix'?' checked':'')+'><b>ผสมตามสัดส่วนข้อสอบจริง</b><small>ง่าย '+(SUBJ.mixLevels['1']||0)+' : ปานกลาง '+(SUBJ.mixLevels['2']||0)+' : ยาก '+(SUBJ.mixLevels['3']||0)+' : ยากมาก '+(SUBJ.mixLevels['4']||0)+' ต่อ 10 ข้อ</small></label>'+
    SUBJ.levels.map(function(l){return '<label class="lv l'+l.id+'"><input type="radio" name="lv" value="'+l.id+'"'+(cl==String(l.id)?' checked':'')+'><b>'+esc(l.name)+'</b><small>'+esc(l.desc)+'</small><span class="n mono">'+(cnt[l.id]||0)+' ข้อ</span></label>'}).join('');
  var scount={};SUBJ.questions.forEach(function(q){scount[q.set]=(scount[q.set]||0)+1});
  $('setBox').innerHTML='<label class="choice"><input type="radio" name="set" value="mix"'+(cs==='mix'?' checked':'')+'><b>สุ่มผสมทุกชุด</b><small>ไม่ซ้ำเดิมทุกครั้ง</small></label>'+SUBJ.sets.filter(function(s){return scount[s.id]}).map(function(s){return '<label class="choice"><input type="radio" name="set" value="'+esc(s.id)+'"'+(cs===s.id?' checked':'')+'><b>'+esc(s.name)+'</b><small>'+esc(s.desc)+'</small></label>'}).join('');
  $('tlAuto').textContent=(SUBJ.exam&&SUBJ.exam.secPerQuestion?SUBJ.exam.secPerQuestion:135)+' วินาทีต่อข้อ';
  var h=(store(K('hist'))||[]);
  $('hist').innerHTML=h.length?'<div class="hrow h"><span>วันที่</span><span>ชุดและระดับ</span><span>โหมด</span><span>ปรนัย</span><span>รวม</span></div>'+h.slice(-8).reverse().map(function(r){return '<div class="hrow"><span>'+esc(r.date)+'</span><span>'+esc(r.set)+(r.lv?'  '+esc(r.lv):'')+'</span><span>'+(r.mode==='exam'?'สอบจริง':'ติวเตอร์')+'</span><span class="mono">'+r.mcq+'/'+r.mcqN+'</span><span class="mono"><b>'+r.pct+'%</b></span></div>'}).join(''):'ยังไม่มี ทำชุดแรกแล้วผลจะมาอยู่ตรงนี้';
  var sv=store(K('active'));$('resumeBtn').classList.toggle('hidden',!(sv&&!sv.submitted));
  var qn=queueIds().length;$('statsBtn').textContent='สถิติและคิวทบทวน'+(qn?' ('+qn+')':'');
  updatePreview();
}
$('subjSel').addEventListener('change',function(){setSubject(this.value);initStart()});
function formOpts(){var f=new FormData($('setup'));return {set:f.get('set')||'mix',mode:f.get('mode')||'exam',scope:f.get('scope')||'all',lv:f.get('lv')||'mix',tl:f.get('tl')||'auto'}}
function updatePreview(){
  var o=formOpts(),ids=pick(o.set,o.scope,o.lv),n=ids.length,m=ids.filter(function(i){return ALL[i].kind==='mcq'}).length;
  var spq=(SUBJ.exam&&SUBJ.exam.secPerQuestion)||135,min=Math.round(n*spq/60);
  $('pv').innerHTML=n?'จะได้ <b>'+n+' ข้อ</b> (ปรนัย '+m+', เติมคำ '+(n-m)+')  ระดับ '+esc(lvLabel(o.lv))+(o.mode==='exam'&&o.tl!=='0'?'  เวลา <b>'+min+' นาที</b>':''):'<span class="warnpv">ไม่มีข้อที่ตรงกับตัวเลือกนี้ ลองเปลี่ยนชุดหรือระดับ</span>';
}
$('setup').addEventListener('change',updatePreview);
$('setup').addEventListener('submit',function(e){e.preventDefault();var o=formOpts();var ids=pick(o.set,o.scope,o.lv);if(!ids.length)return;startNew(o,ids)});
$('resumeBtn').addEventListener('click',function(){var s=store(K('active'));if(s){S=s;enter()}});
function qpool(kind,w,setKey){return (BY[kind+'|'+w]||[]).filter(function(q){return setKey==='mix'||q.set===setKey})}
function pickUnit(kind,w,setKey,lv,n){
  var pool=qpool(kind,w,setKey);
  if(lv!=='mix')return shuffle(pool.filter(function(q){return q.level===+lv})).slice(0,n);
  var mw=SUBJ.mixLevels,Ls=[1,2,3,4],tot=Ls.reduce(function(a,L){return a+(mw[L]||0)},0)||1,quota={},sum=0;
  Ls.forEach(function(L){quota[L]=Math.floor(n*(mw[L]||0)/tot);sum+=quota[L]});
  var order=[2,3,1,4],i=0;while(sum<n){quota[order[i%4]]++;sum++;i++}
  var byL={};Ls.forEach(function(L){byL[L]=shuffle(pool.filter(function(q){return q.level===L}))});
  var out=[],deficit=0;Ls.forEach(function(L){var t=byL[L].splice(0,quota[L]);out=out.concat(t);deficit+=quota[L]-t.length});
  order.forEach(function(L){while(deficit>0&&byL[L].length){out.push(byL[L].shift());deficit--}});
  return shuffle(out);
}
function pick(setKey,scope,lv){
  var ids=[],us=scope==='all'?UNITS:[parseInt(scope.slice(1),10)];
  us.forEach(function(w){var c=UCFG[w];pickUnit('mcq',w,setKey,lv,c.mcq).forEach(function(q){ids.push(q.id)});pickUnit('fill',w,setKey,lv,c.fill).forEach(function(q){ids.push(q.id)})});
  return ids;
}
function startNew(o,ids){
  var spq=(SUBJ.exam&&SUBJ.exam.secPerQuestion)||135,limit=(o.mode==='exam'&&o.tl!=='0')?Math.round(ids.length*spq):0;
  S={sid:SUBJ.id,set:o.set,lv:o.lv,mode:o.mode,scope:o.scope,ids:ids,ans:{},flags:{},rev:{},hint:{},grade:{},cur:0,elapsed:0,t0:Date.now(),limit:limit,submitted:false,perm:makePerm(ids)};save();enter();
}
function retryWrong(){
  var wrong=S.ids.filter(function(id){return sc(id)<1});if(!wrong.length)return;
  S={sid:SUBJ.id,set:S.set,lv:'retry',mode:'tutor',scope:'retry',ids:wrong,ans:{},flags:{},rev:{},hint:{},grade:{},cur:0,elapsed:0,t0:Date.now(),limit:0,submitted:false,perm:makePerm(wrong)};save();enter();
}
function save(){store(K('active'),S)}
function makePerm(ids){var p={};ids.forEach(function(id){var it=ALL[id];if(it.kind!=='mcq')return;var a=['A','B','C','D'];p[id]=it.ns?a:shuffle(a)});return p}
function perm(id){return (S.perm&&S.perm[id])||['A','B','C','D']}
function dl(id,orig){return 'ABCD'.charAt(perm(id).indexOf(orig))}
function runLabel(){return (S.scope==='retry'?'ทบทวนข้อที่ผิด':setName(S.set)+'  '+lvLabel(S.lv))}

/* exam */
function enter(){show('exam');S.t0=Date.now()-S.elapsed*1000;$('cand').textContent=runLabel()+'   '+(S.mode==='exam'?'สอบจริง':'ติวเตอร์');
  $('map').open=window.innerWidth>=1180;buildMap();render();clearInterval(tick);tick=setInterval(updTimer,500);updTimer()}
function fmt(s){s=Math.max(0,Math.floor(s));return pad(Math.floor(s/3600),2)+':'+pad(Math.floor(s%3600/60),2)+':'+pad(s%60,2)}
function updTimer(){
  if(!S||S.submitted)return;var el=Math.floor((Date.now()-S.t0)/1000);S.elapsed=el;var t=$('timer');
  if(S.limit){var left=S.limit-el;t.textContent=fmt(left);t.classList.toggle('low',left<600);if(left<=0){submit(true);return}}else{t.textContent=fmt(el);t.classList.remove('low')}
  if(el%10===0)save();
}
function answered(id){var it=ALL[id];return it.kind==='mcq'?!!S.ans[id]:!!(S.ans[id]&&S.ans[id].trim())}
function buildMap(){
  var by={},order=[];S.ids.forEach(function(id,i){var w=ALL[id].week;if(!by[w]){by[w]=[];order.push(w)}by[w].push(i)});
  $('mapbody').innerHTML=order.map(function(w){return '<div class="wg"'+hs(w)+'><h4><span class="chip">'+esc(US)+w+'</span><span class="muted">'+esc(UCFG[w].name)+'</span></h4><div class="cells">'+by[w].map(function(i){return '<button type="button" class="cell" data-i="'+i+'" aria-label="ไปข้อ '+(i+1)+'">'+(i+1)+'</button>'}).join('')+'</div></div>'}).join('')+
    '<div class="legend"><span>ขอบสี = ยังไม่ตอบ</span><span>เติมสี = ตอบแล้ว</span><span>มุมเหลือง = ปักธง</span>'+(S.mode==='tutor'?'<span>เขียว = ถูก</span><span>แดง = ผิด</span>':'')+'</div>';
  $('seg').innerHTML=order.map(function(w){return '<i style="--h:'+UCFG[w].hue+';flex:'+by[w].length+'" data-w="'+w+'"><b></b></i>'}).join('');
}
$('mapbody').addEventListener('click',function(e){var b=e.target.closest('.cell');if(b){go(parseInt(b.dataset.i,10));if(window.innerWidth<1180)$('map').open=false}});
function narrow(){return window.innerWidth<1180}
function go(i){if(i<0||i>=S.ids.length)return;S.cur=i;save();if(view==='gate')show('exam');render();if(narrow())window.scrollTo({top:0,behavior:'auto'})}
function toTutor(){if(narrow()){var t=$('tutor');var y=t.getBoundingClientRect().top+window.scrollY-76;window.scrollTo({top:y,behavior:'smooth'})}}
function updMap(){
  var done=0,per={};
  $('mapbody').querySelectorAll('.cell').forEach(function(c){var i=+c.dataset.i,id=S.ids[i],it=ALL[id],a=answered(id);if(a){done++;per[it.week]=(per[it.week]||0)+1}
    var cl='cell';if(a)cl+=' ans';if(S.mode==='tutor'&&S.rev[id]&&it.kind==='mcq')cl='cell'+(S.ans[id]===it.ans?' ok':' no');if(S.flags[id])cl+=' fl';if(i===S.cur)cl+=' cur';c.className=cl});
  var tot={};S.ids.forEach(function(id){tot[ALL[id].week]=(tot[ALL[id].week]||0)+1});
  $('seg').querySelectorAll('i').forEach(function(s){var w=s.dataset.w;s.firstChild.style.width=((per[w]||0)/tot[w]*100)+'%'});
  $('mapcnt').textContent=done+'/'+S.ids.length;
}
function notePath(w){return (SUBJ.notesPath||'').replace('{nn}',pad(w,2)).replace('{n}',String(w))}
function verdictCard(it,id){
  var ok=S.ans[id]===it.ans,head=ok?'ถูก':(S.ans[id]?'ยังไม่ใช่ ที่ถูกคือ '+dl(id,it.ans):'ไม่ได้ตอบ ที่ถูกคือ '+dl(id,it.ans));
  return '<div class="verdict '+(ok?'ok':'bad')+'"><h4>'+esc(head)+'</h4><p>'+md(it.expl)+'</p>'+(it.src?'<div class="src">'+esc(it.src)+'</div>':'')+'</div>';
}
function norm(t){return String(t).toLowerCase().replace(/[,\s]/g,'').replace(/[–−]/g,'-')}
function nums(t){var m=String(t).replace(/,/g,'').match(/-?\d+(?:\.\d+)?/g);return m?m.map(Number):[]}
function suggest(it,ans){
  if(!ans||!String(ans).trim())return {v:0,why:'ยังไม่ได้ตอบ'};
  var parts=String(it.key).split(';').map(function(x){return x.trim()}).filter(Boolean),m=0,un=nums(ans);
  parts.forEach(function(p){var pn=nums(p),ok=false,letters=p.replace(/[0-9.,\s%-]/g,'');
    if(pn.length&&letters.length<=2){ok=pn.every(function(x){return un.some(function(y){return Math.abs(y-x)<=Math.max(1e-9,Math.abs(x)*0.005)})})}
    else{ok=norm(ans).indexOf(norm(p))>=0}
    if(ok)m++});
  return {v:m===parts.length?1:(m>0?0.5:0),why:'ตรง '+m+' จาก '+parts.length+' ช่อง'};
}
function fillCard(it,id){var g=S.grade[id],sg=suggest(it,S.ans[id]);

  var weakT=Object.keys(byT).map(function(k){return byT[k]}).filter(function(t){return t.w>0}).sort(function(a,b){return b.w/b.n-a.w/a.n||b.w-a.w}).slice(0,8);
  var h='<h2>สถิติของคุณ '+esc(SUBJ.title)+'</h2>';
  if(!tot){h+='<p class="muted" style="margin:8px 0 18px">ยังไม่มีข้อมูล ทำข้อสอบหนึ่งชุดแล้วกลับมาดู ระบบจะจำว่าข้อไหนผิดและสร้างคิวทบทวนให้</p>'}
  else{
    h+='<div class="stats" style="margin:14px 0 20px"><div class="stat"><b>'+tot+'</b><span>ครั้งที่ตอบ</span></div><div class="stat"><b>'+Math.round((tot-wr)/tot*100)+'%</b><span>ตอบถูก</span></div><div class="stat"><b>'+ids.length+'/'+all+'</b><span>ข้อที่เคยทำ</span></div><div class="stat"><b>'+q+'</b><span>ข้อในคิวทบทวน</span></div></div>';
    h+='<h3 style="font-size:1rem;margin-bottom:8px">ตามระดับ</h3><div class="lvres">'+Object.keys(byL).sort().map(function(l){var o=byL[l];return '<span class="chip n lv"><span class="meter" aria-hidden="true">'+[1,2,3,4].map(function(i){return '<i'+(i<=l?' class="on"':'')+'></i>'}).join('')+'</span>'+esc(lvName(+l))+' '+Math.round((o.n-o.w)/o.n*100)+'% ('+o.n+')</span>'}).join('')+'</div>';
    h+='<h3 style="font-size:1rem;margin:18px 0 8px">ตาม'+esc(UL)+'</h3>'+UNITS.filter(function(w){return byU[w]}).map(function(w){var o=byU[w],p=Math.round((o.n-o.w)/o.n*100);return '<div class="wkrow"'+hs(w)+'><span><span class="chip">'+esc(US)+w+'</span></span><div class="bar"><i style="width:'+Math.max(p,2)+'%"></i></div><span class="mono">'+p+'%</span></div>'}).join('');
    if(weakT.length)h+='<h3 style="font-size:1rem;margin:18px 0 8px">หัวข้อที่พลาดบ่อย</h3>'+weakT.map(function(t){return '<div class="weakrow"'+hs(t.week)+'><span class="chip">'+esc(US)+t.week+'</span><span class="wt">'+esc(t.topic)+'</span><span class="mono">พลาด '+t.w+' จาก '+t.n+'</span></div>'}).join('');
  }
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px"><button class="btn primary" id="qBtn" type="button"'+(q?'':' disabled')+'>ทบทวนข้อที่เคยผิด ('+q+' ข้อ)</button><button class="btn" id="sBack" type="button">กลับ</button><button class="btn" id="sClear" type="button">ล้างสถิติ</button></div>';
  $('stats').innerHTML=h;
}
$('stats').addEventListener('click',function(e){
  if(e.target.closest('#qBtn'))startQueue();
  else if(e.target.closest('#sBack')){initStart();show('start')}
  else if(e.target.closest('#sClear')){var b=$('sClear');if(b.dataset.armed){store(K('qstat'),{});showStats()}else{b.dataset.armed='1';b.textContent='กดอีกครั้งเพื่อยืนยันการล้าง'}}
});
$('statsBtn').addEventListener('click',showStats);
setSubject((store('mock-last-subject')||PACK.subjects[0].id));
initStart();
window.addEventListener('pagehide',function(){store('mock-last-subject',SUBJ.id)});
})();
</script>
</body>
</html>
